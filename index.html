<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NL Navigator | L3 Restored Command</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --gold: #FFD700; --neon-blue: #00FFFF; --bg: rgba(5, 5, 5, 0.95); }
        body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: monospace; }
        
        /* The Missing Map Layer */
        #map { height: 100vh; width: 100vw; z-index: 1; filter: brightness(0.6) contrast(1.2); }

        /* Widget Architecture */
        .widget { position: absolute; z-index: 1000; pointer-events: auto; background: var(--bg); border: 1px solid var(--gold); padding: 12px; color: #fff; }
        
        /* Velocity Controller (Top Right) */
        #velocity-ctrl { top: 20px; right: 20px; width: 420px; border-top: 3px solid var(--neon-blue); }
        .h-bar { height: 14px; cursor: pointer; border: 1px solid #000; transition: transform 0.1s; }
        .h-bar:hover { transform: scaleY(1.2); }
        .h-bar.active { border: 2px solid #fff; transform: scaleY(1.4); z-index: 10; }

        /* Bottom Command Deck */
        #deck { position: absolute; bottom: 30px; left: 30px; display: flex; gap: 15px; z-index: 1000; pointer-events: none; }
        .deck-panel { pointer-events: auto; background: var(--bg); border: 1px solid var(--gold); padding: 15px; width: 400px; }
        .blue-trim { border-left: 3px solid var(--neon-blue); }

        table { width: 100%; font-size: 11px; text-align: left; border-collapse: collapse; }
        th { color: #666; font-size: 9px; text-transform: uppercase; padding-bottom: 5px; border-bottom: 1px solid #333; }
        td { padding: 6px 0; border-bottom: 1px solid #222; }

        /* Glass Nodes (Spatial UI) */
        .glass-node {
            background: rgba(10, 10, 10, 0.9); border: 1px solid var(--gold); border-radius: 2px;
            width: 110px; color: #fff; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .g-head { background: var(--gold); color: #000; font-size: 9px; font-weight: 900; padding: 2px; }
        .g-temp { font-size: 18px; font-weight: 900; padding: 5px 0; }
    </style>
</head>
<body>

<div id="map"></div>

<div id="velocity-ctrl" class="widget">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div>
            <span style="font-size: 9px; color: var(--gold); font-weight: bold;">DEPARTURE (T-OFFSET)</span>
            <div id="clock" style="font-size: 24px; font-weight: bold; letter-spacing: 1px;">--:--</div>
        </div>
        <div id="t-label" style="color: var(--neon-blue); font-weight: bold; font-size: 14px;">T+0 HRS</div>
    </div>
    <div id="h-grid" style="display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px;"></div>
</div>

<div id="deck">
    <div id="matrix-panel" class="deck-panel">
        <div style="color: var(--gold); font-weight: bold; margin-bottom: 10px; font-size: 11px; letter-spacing: 1px;">MISSION WEATHER MATRIX</div>
        <table>
            <thead><tr><th>HUB</th><th>TEMP</th><th>WIND</th><th>PRECIP</th></tr></thead>
            <tbody id="m-body"></tbody>
        </table>
    </div>

    <div id="analytics-panel" class="deck-panel blue-trim">
        <div style="color: var(--neon-blue); font-weight: bold; margin-bottom: 10px; font-size: 11px; letter-spacing: 1px;">ROAD SURFACE INTELLIGENCE</div>
        <table>
            <thead><tr><th>LOCATION</th><th>RST</th><th>STATE</th></tr></thead>
            <tbody id="a-body"></tbody>
        </table>
    </div>
</div>

<script>
/** * WEONG ROUTE: L3 RESTORED BUILD
 * Logic: Conditions drive colors, NL dataset drives labels.
 */

(async function core() {
    // 1. Map Init (Dark Baseline)
    window.map = L.map('map', { zoomControl: false }).setView([48.5, -55.5], 7);
    L.tileLayer('https://{s}.tile.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(window.map);

    const weatherLayer = L.layerGroup().addTo(window.map);
    let routeLine = null;

    // 2. Global State
    window.tOffset = 0;
    window.commData = [];
    window.hubs = [];

    // 3. Load NL Dataset
    try {
        const res = await fetch('/data/nl/communities.json');
        const data = await res.json();
        window.commData = data.features.map(f => ({
            lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0], name: f.properties.name
        }));
    } catch(e) { console.warn("Using community fallback."); }

    // 4. Hub Config
    const points = [{n:"Corner Brook", lat:48.95, lng:-57.94}, {n:"St. John's", lat:47.56, lng:-52.71}];
    points.forEach(p => {
        const m = L.marker([p.lat, p.lng], { draggable: true }).addTo(window.map);
        m.on('dragend', () => sync());
        window.hubs.push(m);
    });

        for(let i=0; i<24; i++) {
            const h = i * 2;
            const bar = document.createElement('div');
            bar.className = `h-bar ${window.tOffset === h ? 'active' : ''}`;
